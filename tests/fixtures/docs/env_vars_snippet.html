<!DOCTYPE html>
<html>
<body>
<h1>Environment Variables</h1>
<table class="docutils">
  <thead>
    <tr><th>Variable</th><th>Description</th></tr>
  </thead>
  <tbody>
    <tr>
      <td><code>NIM_LOG_LEVEL</code></td>
      <td>Controls NIM service log verbosity (INFO, WARNING, ERROR).</td>
    </tr>
    <tr>
      <td><code>NIM_MAX_MODEL_LEN</code></td>
      <td>Maximum sequence length integer for the model context window.</td>
    </tr>
    <tr>
      <td><code>NIM_MODEL_PROFILE</code></td>
      <td>Profile ID selecting engine, precision, and tensor-parallel layout.</td>
    </tr>
  </tbody>
</table>
</body>
</html>
